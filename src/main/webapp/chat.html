<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC 비디오 채팅</title>
  <link href="modern.css" rel="stylesheet">
  <!-- [Spring 변환] 원본: ../shared.css → 동일 디렉토리로 이동 -->
  <link href="shared.css" rel="stylesheet">
  <script type="text/javascript" src="auth.js"></script>
  <script type="text/javascript" src="chatclient.js"></script>
  <script src="adapter.js"></script>
</head>
<body>
  <!-- 로그아웃 버튼 -->
  <button id="logout-button" onclick="logout()" style="position: fixed; top: 20px; right: 20px; z-index: 1000; background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;">
    🚪 로그아웃
  </button>

  <script>
    function logout() {
      if (confirm('로그아웃하시겠습니까?')) {
        localStorage.removeItem('jwtToken');
        localStorage.removeItem('username');
        window.location.href = 'login.html';
      }
    }
  </script>
  <div class="container">
    <div class="infobox">
      <h1>
        <span>📹</span> WebRTC 비디오 채팅
      </h1>
      <p>WebSocket과 WebRTC를 사용한 실시간 비디오 통화 시스템입니다. JSON 시그널링 패킷을 서버와 교환하여 P2P 연결을 구축합니다.</p>
      <p><a href="https://github.com/mdn/samples-server/tree/master/s/webrtc-from-chat">GitHub에서 소스 코드 확인</a></p>
      <p style="opacity: 0.8; font-size: 14px;">⚠️ 이 예제는 데모용이며, 실제 서비스용으로 사용해서는 안 됩니다.</p>
    </div>

    <div class="userlistbox">
      <h3>
        <span>👥</span> 접속자 목록
      </h3>
      <ul id="userlist">
        <!-- 사용자 목록이 여기에 표시됩니다 -->
      </ul>
    </div>

    <div class="camerabox">
      <video id="received_video" autoplay playsinline></video>
      <video id="local_video" autoplay muted playsinline></video>
      <button id="mute-button" onclick="toggleAudio();" role="button" disabled>
        🎤 마이크 끄기
      </button>
      <button id="video-button" onclick="toggleVideo();" role="button" disabled>
        📷 카메라 끄기
      </button>
      <button id="hangup-button" onclick="hangUpCall();" role="button" disabled>
        📞 통화 종료
      </button>
    </div>
  </div>
</body>
</html>
